<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF0F2">
<title>Carnet de Fonte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : carnet d'entraînement mobile — liste de séances par semaine, onglets en bas, disques de compétition comme repères A/B/C */
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --soft:#E2E7ED; --ink:#15181C; --muted:#5A636D; --line:#D3D9E0;
  --accent:#2156C7; --accent-ink:#FFFFFF;
  --pa:#C8322B; --pb:#2156C7; --pc:#E2B41B; --pc-ink:#15181C;
  --ok:#1E8A4C; --warn:#B26B12;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111418; --surface:#1A1E24; --soft:#232931; --ink:#E8EBEE; --muted:#9BA5AF; --line:#2D333B;
  --accent:#6F9CF2; --accent-ink:#0E1420; --pa:#E0544C; --pb:#5B8DEF; --pc:#E8C13A; --pc-ink:#15181C;
  --ok:#43C27E; --warn:#E39B3B; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#1A1E24; --soft:#232931; --ink:#E8EBEE; --muted:#9BA5AF; --line:#2D333B;
  --accent:#6F9CF2; --accent-ink:#0E1420; --pa:#E0544C; --pb:#5B8DEF; --pc:#E8C13A; --pc-ink:#15181C;
  --ok:#43C27E; --warn:#E39B3B; color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:30px} h2{font-size:24px} h3{font-size:19px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px 28px;display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font:700 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{white-space:nowrap;font:700 23px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px}
.sync{margin-left:auto;min-width:0;text-align:right;display:flex;align-items:center;gap:6px;font:500 11px/1.2 var(--mono);color:var(--muted);background:none;border:0;padding:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.busy{background:var(--accent)}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:9px 2px 11px;font:700 12px var(--body);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.02em}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

.plate{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--display);color:#fff;flex:none;position:relative;box-shadow:inset 0 0 0 4px rgba(255,255,255,.18)}
.plate::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--surface);opacity:.0}
.pA{background:var(--pa)} .pB{background:var(--pb)} .pC{background:var(--pc);color:var(--pc-ink)}

.next{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.next .row{display:flex;gap:12px;align-items:center}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);text-align:center;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}
.btn.ok{background:var(--ok);color:#fff}
.btn:disabled{opacity:.5;cursor:default}

.week{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.weekhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding-top:8px}
.weekhead .wn{font:700 21px var(--display);text-transform:uppercase}
.tag{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.07em;padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.tag.deload{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;text-align:left}
.srow.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.srow .t1{font-weight:700}
.srow .t2{font-size:14px;color:var(--muted)}
.pill{font:700 12px var(--body);padding:4px 9px;border-radius:99px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill.done{background:var(--ok);color:#fff}
.pill.today{background:var(--accent);color:var(--accent-ink)}
.pill.miss{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.part{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}

.back{background:none;border:0;padding:6px 0;font-weight:700;color:var(--accent);align-self:flex-start}
.shead{display:flex;gap:14px;align-items:center}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.checkline{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.checkline .grow{flex:1;min-width:0}

.excard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.exhead{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;align-items:start}
.thumb{width:88px;height:70px;padding:0;border:0;border-radius:8px;background:var(--soft);display:block}
.thumb svg{width:100%;height:100%;display:block}
.exname{font-weight:700;font-size:17px;line-height:1.2}
.exmeta{font-size:14px;color:var(--muted)}
.sugg{font-size:13.5px;border-left:3px solid var(--accent);padding:4px 8px;background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:0 6px 6px 0}
.ss{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--pa)}
.sets{display:flex;flex-direction:column;gap:6px}
.setrow{display:grid;grid-template-columns:30px minmax(0,1fr) 14px minmax(0,1fr) 46px;gap:8px;align-items:center}
.setrow.time{grid-template-columns:30px minmax(0,1fr) 46px}
.setrow .sn{font:500 13px var(--mono);color:var(--muted)}
.setrow .x{color:var(--muted);text-align:center}
.field{position:relative;min-width:0}
.field input{width:100%;min-width:0;font:500 16px var(--mono);padding:9px 34px 9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.field span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.chk{width:46px;height:42px;border-radius:9px;border:2px solid var(--line);background:transparent;display:grid;place-items:center}
.chk svg{width:20px;height:20px;opacity:.35}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chk[aria-pressed="true"] svg{opacity:1}
textarea{width:100%;min-height:70px;font:15px var(--body);padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);resize:vertical}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
td.num,th.num{text-align:right;white-space:nowrap}
.chart svg{width:100%;height:auto;display:block}
.chart text{font:11px var(--mono);fill:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.extile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px}
.extile .fig{width:100%;height:auto;aspect-ratio:200/160;background:var(--soft);border-radius:8px;display:block}
.extile b{font-size:15px;line-height:1.2}
.extile span{font-size:12.5px;color:var(--muted)}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.form input,.form select,.inp{width:100%;min-width:0;font:500 16px var(--mono);padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:10px;padding:10px}
.stat b{display:block;font:700 24px var(--display)}
.stat span{font-size:12px;color:var(--muted)}

.overlay{position:fixed;inset:0;background:rgba(10,12,15,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet .bigfig{width:100%;max-width:420px;align-self:center;aspect-ratio:200/160;background:var(--soft);border-radius:12px;display:block}
.sheethead{display:flex;align-items:flex-start;gap:10px}
.sheethead h2{flex:1}
.cues li::marker{color:var(--accent);font-weight:700}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{width:44px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.days button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.err{color:var(--pa);font-size:14px}
.okmsg{color:var(--ok);font-size:14px}
code{font:13px var(--mono);background:var(--soft);padding:1px 5px;border-radius:4px;word-break:break-all}

/* figures */
.fig .fl{stroke:var(--line);stroke-width:2}
.fig .lb{stroke:var(--ink);stroke-width:7;stroke-linecap:round;fill:none}
.fig .torso{stroke-width:10}
.fig .far{opacity:.3}
.fig .hd{fill:var(--ink)}
.fig .wt{fill:var(--accent)}
.fig .wt2{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.fig .hub{fill:var(--soft)}
.fig .eq{fill:var(--muted);opacity:.45}
.fig .eqs{stroke:var(--muted);opacity:.45;stroke-width:5;stroke-linecap:round;fill:none}
.fig .cb{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
@media (prefers-reduced-motion: reduce){.bar > i{transition:none}}
#synctxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
@media (max-width:440px){#synctxt{display:none}.sync .dot{width:12px;height:12px}}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="brand"><svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="var(--pa)"/><circle cx="13" cy="13" r="7" fill="none" stroke="var(--surface)" stroke-width="1.5" opacity=".5"/><circle cx="13" cy="13" r="2.5" fill="var(--surface)"/></svg>Carnet de Fonte</div>
  <button class="sync" id="syncbtn" title="État de la synchronisation"><i class="dot" id="syncdot"></i><span id="synctxt">Sur cet appareil</span></button>
  <button class="iconbtn" id="gear" aria-label="Réglages et Dropbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div></header>

<main id="main"></main>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="seances"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 15l2.5 2.5L16 13"/></svg>Séances</button>
  <button data-tab="programme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 20h18M6 16V9M11 16V5M16 16v-5M21 16v-8"/></svg>Programme</button>
  <button data-tab="exercices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Exercices</button>
  <button data-tab="suivi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 17l5-5 4 4 8-8M15 8h5v5"/></svg>Suivi</button>
</div></nav>

<div id="layer"></div>

<script>
"use strict";
/* ============ Bibliothèque d'exercices ============ */
const EX={
 squat:{n:"Squat barre",m:"Quadriceps, fessiers, gainage",e:"Barre olympique + rack à squat",inc:5,
  c:["Barre posée sur le haut du dos (trapèzes), pas sur la nuque","Pieds largeur d'épaules, pointes légèrement ouvertes","Descendre en poussant les hanches en arrière, genoux dans l'axe des pieds, au moins jusqu'à la parallèle","Remonter en poussant le sol, dos neutre, poitrine haute"],
  err:"Talons qui décollent, genoux qui rentrent vers l'intérieur, dos qui s'arrondit en bas.",alt:"Hack squat ou presse à cuisses si le dos ou les genoux coincent."},
 bench:{n:"Développé couché barre",m:"Pectoraux, triceps, avant d'épaules",e:"Barre + banc plat avec support",inc:2.5,
  c:["Allongé, yeux sous la barre, omoplates serrées et basses","Pieds à plat au sol, fessiers sur le banc","Descendre la barre contrôlée au bas des pectoraux, coudes à ~45° du corps","Pousser jusqu'à bras tendus sans verrouiller brutalement"],
  err:"Rebondir sur la poitrine, coudes à 90° (épaules exposées), fesses qui décollent.",alt:"Développé couché haltères ou machine à développé."},
 row:{n:"Rowing poulie basse",m:"Grand dorsal, rhomboïdes, biceps",e:"Poulie basse assise + poignée triangle",inc:5,
  c:["Assis, pieds sur la plateforme, genoux légèrement fléchis","Dos droit, ne pas se balancer","Tirer la poignée vers le nombril en serrant les omoplates","Revenir bras tendus en laissant les épaules s'étirer vers l'avant"],
  err:"Tirer avec le dos en se jetant en arrière, hausser les épaules.",alt:"Machine à rowing assis avec appui poitrine."},
 lunge:{n:"Fentes marchées haltères",m:"Quadriceps, fessiers, équilibre",e:"2 haltères",inc:2,
  c:["Un haltère dans chaque main, bras le long du corps","Grand pas en avant, descendre le genou arrière près du sol","Genou avant au-dessus du pied, buste droit","Pousser sur le talon avant pour enchaîner le pas suivant"],
  err:"Pas trop court (genou avant qui dépasse beaucoup), buste penché en avant.",alt:"Fentes arrière sur place si la salle manque de place."},
 lateral:{n:"Élévations latérales",m:"Deltoïde moyen (largeur d'épaules)",e:"2 haltères légers",inc:1,
  c:["Debout, coudes très légèrement fléchis","Monter les bras sur les côtés jusqu'à l'horizontale","Mener avec les coudes, petits doigts légèrement plus hauts","Redescendre lentement en 2 secondes"],
  err:"Charge trop lourde avec élan du buste, épaules qui montent vers les oreilles.",alt:"Élévations latérales à la poulie basse."},
 plank:{n:"Gainage planche",m:"Abdominaux profonds, lombaires",e:"Poids du corps (tapis)",kind:"time",inc:5,
  c:["Appui sur les avant-bras, coudes sous les épaules","Corps aligné de la tête aux talons","Serrer fessiers et abdos, rentrer le nombril","Respirer normalement, ne pas bloquer"],
  err:"Bassin qui s'affaisse ou fesses trop hautes.",alt:"Planche sur les genoux pour démarrer."},
 rdl:{n:"Soulevé de terre roumain",m:"Ischio-jambiers, fessiers, lombaires",e:"Barre olympique",inc:5,
  c:["Debout, barre en mains contre les cuisses, genoux légèrement fléchis","Pousser les hanches en arrière, la barre glisse le long des cuisses","Descendre jusqu'à mi-tibia en gardant le dos plat","Remonter en poussant les hanches vers l'avant, fessiers serrés"],

 pulldown:{n:"Tirage vertical",m:"Grand dorsal, biceps",e:"Machine à poulie haute + barre large",inc:5,
  c:["Cuisses bloquées sous les boudins, prise un peu plus large que les épaules","Buste légèrement incliné en arrière","Tirer la barre vers le haut de la poitrine, coudes vers le bas","Remonter bras tendus en contrôlant"],
  err:"Tirer derrière la nuque, se balancer en arrière pour finir le mouvement.",alt:"Tractions assistées à la machine."},
 ohp:{n:"Développé militaire haltères assis",m:"Épaules, triceps",e:"2 haltères + banc à dossier vertical",inc:2,
  c:["Assis, dos collé au dossier, haltères à hauteur d'épaules","Pousser vers le haut jusqu'à bras presque tendus","Les haltères se rapprochent en haut sans se toucher","Redescendre jusqu'aux oreilles"],
  err:"Cambrer fort le bas du dos, descendre trop bas.",alt:"Machine à développé épaules."},
 legpress:{n:"Presse à cuisses",m:"Quadriceps, fessiers",e:"Presse inclinée à 45°",inc:10,
  c:["Dos et bassin collés au dossier","Pieds largeur de hanches au milieu de la plateforme","Descendre jusqu'à ~90° aux genoux sans décoller le bassin","Pousser sans verrouiller les genoux en haut"],
  err:"Bassin qui s'enroule en bas, genoux verrouillés en haut.",alt:"Hack squat."},
 legcurl:{n:"Leg curl allongé",m:"Ischio-jambiers",e:"Machine leg curl",inc:5,
  c:["Allongé sur le ventre, boudin juste au-dessus des talons","Genoux juste après le bord du banc","Ramener les talons vers les fesses","Redescendre lentement, sans claquer les poids"],

const BLOCKS=["Adaptation","Progression","Intensification"];
function weekInfo(w){
  const deload=w%4===0, b=Math.min(2,Math.floor((w-1)/4));
  return {b,deload,rir:deload?4:[3,2,1][b],rpe:deload?6:[7,8,9][b],cardio:deload?10:[10,12,12][b],
    label:deload?(w===12?"Décharge + bilan":"Décharge"):BLOCKS[b]};
}
function setsFor(it,w){const wi=weekInfo(w);const n=it.s[wi.b];return wi.deload?Math.max(2,n-1):n}
function restSec(s){const m=s.match(/(\d+)(?:-(\d+))?\s*(min|s)/);if(!m)return 60;const v=m[2]?(+m[1]+ +m[2])/2:+m[1];return m[3]==="min"?v*60:v}
function topReps(r){const n=(r.match(/\d+/g)||[0]).map(Number);return Math.max(...n)}
function duration(t,w){
  let s=300;for(const it of PLAN[t].items){const n=setsFor(it,w);s+=n*((it.ss?0:restSec(it.rest))+(it.w||30))}
  return Math.round(s/60+weekInfo(w).cardio);
}

/* ============ Dates ============ */
const pd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const mondayOf=s=>{const d=pd(s);return addD(s,-((d.getDay()+6)%7))};
const fmtD=(s,o)=>pd(s).toLocaleDateString("fr-FR",o||{weekday:"short",day:"numeric",month:"short"});
const JOURS=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];

function schedule(){
  const st=S.settings,mon=mondayOf(st.startDate),out=[];let n=0;
  for(let w=1;w<=12;w++)for(const d of [...st.days].sort((a,b)=>a-b)){out.push({date:addD(mon,(w-1)*7+d),week:w,t:"ABC"[n%3]});n++}
  return out;
}
function ensureLog(ses){
  let L=S.sessions[ses.date];
  if(L&&L.t!==ses.t&&!L.done){L.t=ses.t;L.sets={}}
  if(!L){L=S.sessions[ses.date]={t:ses.t,week:ses.week,warm:false,cardio:false,done:false,note:"",sets:{},updatedAt:0}}
  for(const it of PLAN[ses.t].items){
    const n=setsFor(it,ses.week);const a=L.sets[it.x]=L.sets[it.x]||[];
    while(a.length<n)a.push({kg:"",reps:"",ok:false});
  }
  return L;
}
function progress(ses){
  const L=S.sessions[ses.date];let tot=2,ok=0;
  for(const it of PLAN[ses.t].items)tot+=setsFor(it,ses.week);
  if(!L)return{tot,ok,pct:0};
  ok+=(L.warm?1:0)+(L.cardio?1:0);
  for(const it of PLAN[ses.t].items){const a=(L.sets[it.x]||[]).slice(0,setsFor(it,ses.week));ok+=a.filter(s=>s.ok).length}
  return{tot,ok,pct:Math.round(ok/tot*100)};
}
function status(ses){
  const L=S.sessions[ses.date],t=today();
  if(L&&L.done)return["done","Faite"];
  if(ses.date===t)return["today","Aujourd'hui"];
  const p=progress(ses);
  if(ses.date<t)return p.ok>0?["part","Partielle"]:["miss","Manquée"];
  return["","À venir"];
}
function suggest(x,date,week){
  const it=Object.values(PLAN).flatMap(p=>p.items).find(i=>i.x===x),E=EX[x],wi=weekInfo(week);
  const prev=Object.keys(S.sessions).filter(d=>d<date&&S.sessions[d].sets&&S.sessions[d].sets[x]&&S.sessions[d].sets[x].some(s=>s.ok&&(s.kg!==""||s.reps!==""))).sort().pop();
  const time=E.kind==="time";
  if(!prev)return{v:"",txt:time?"Première fois : tiens autant que possible en gardant le corps bien aligné.":`Première fois : choisis une charge qui te laisse ${wi.rir} répétition${wi.rir>1?"s":""} en réserve sur chaque série.`};
  const a=S.sessions[prev].sets[x].filter(s=>s.ok);
  if(time){const best=Math.max(...a.map(s=>+s.reps||0));const all=a.every(s=>(+s.reps||0)>=45);
    return{v:"",r:all?best+5:best,txt:all?`Dernière fois ${best} s partout : vise ${best+5} s.`:`Dernière fois jusqu'à ${best} s : vise 45 s sur chaque série.`}}
  const kg=Math.max(...a.map(s=>parseFloat(String(s.kg).replace(",","."))||0));
  const top=topReps(it.r);const allTop=a.length>=it.s[0]-1&&a.every(s=>(+s.reps||0)>=top);
  const round=v=>Math.round(v/E.inc)*E.inc;
  if(wi.deload){const v=round(kg*0.9);return{v,txt:`Semaine de décharge : ${fmtKg(v)} kg (≈ 90 % de ${fmtKg(kg)} kg), sans forcer.`}}
  if(E.bw&&!kg){return{v:"",txt:allTop?`Toutes les séries au maximum : ralentis la descente (3 s) ou ajoute un lest.`:`Ajoute des répétitions jusqu'à ${top} sur chaque série.`}}
  if(allTop&&kg>0){const v=kg+E.inc;return{v,txt:`Toutes les séries au maximum la dernière fois : passe à ${fmtKg(v)} kg (+${fmtKg(E.inc)}).`}}
  return{v:kg||"",txt:kg?`Garde ${fmtKg(kg)} kg et ajoute des répétitions jusqu'à ${top} sur chaque série.`:"Note la charge utilisée pour suivre ta progression."};
}

function figInner(x,k){

  if(p.knee2)s+=ln(p.hip,p.knee2,far)+ln(p.knee2,p.ankle2,far);
  if(p.elb2)s+=ln(p.sh,p.elb2,far)+ln(p.elb2,p.hand2,far);

function lineChart(pts,unit,color){

  if(pts.length<2)return`<p class="muted small" style="margin:0">${pts.length?`Une mesure : ${fmtKg(pts[0].y)} ${unit}. `:""}La courbe apparaît à partir de deux mesures. Une par semaine, même jour, le matin à jeun.</p>`;
  const xs=pts.map(p=>pd(p.d).getTime()),x0=Math.min(...xs),x1=Math.max(...xs);
  let y0=Math.min(...pts.map(p=>p.y)),y1=Math.max(...pts.map(p=>p.y));const pad=Math.max(1,(y1-y0)*.15);y0=Math.floor(y0-pad);y1=Math.ceil(y1+pad);
  const X=t=>l+(W-l-r)*((t-x0)/(x1-x0||1)),Y=v=>top+(H-top-bot)*(1-(v-y0)/(y1-y0));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(const g of[y0,(y0+y1)/2,y1])s+=`<line x1="${l}" x2="${W-r}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)"/><text x="${l-5}" y="${Y(g)+4}" text-anchor="end">${fmtKg(g)}</text>`;
  const pl=pts.map(p=>`${X(pd(p.d).getTime())},${Y(p.y)}`).join(" ");
  s+=`<polygon points="${l},${Y(y0)} ${pl} ${W-r},${Y(y0)}" fill="${color}" opacity=".12"/><polyline points="${pl}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{const last=i===pts.length-1;s+=`<circle cx="${X(pd(p.d).getTime())}" cy="${Y(p.y)}" r="${last?5:3}" fill="${color}"/>`});
  s+=`<text x="${l}" y="${H-6}">${fmtD(pts[0].d,{day:"numeric",month:"short"})}</text><text x="${W-r}" y="${H-6}" text-anchor="end">${fmtD(pts[pts.length-1].d,{day:"numeric",month:"short"})}</text>`;
  return s+`</svg>`;
}

const DBX_PATH="/carnet-fonte.json",TOKEN_URL="https://api.dropboxapi.com/oauth2/token";
function b64url(bytes){let s="";bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function sha256js(ascii){
  const rr=(v,a)=>(v>>>a)|(v<<(32-a)),mx=2**32,words=[],bitLen=ascii.length*8;let hash=[];const k=[],comp={};let pc=0;
  for(let c=2;pc<64;c++){if(!comp[c]){for(let i=0;i<313;i+=c)comp[i]=c;hash[pc]=(Math.pow(c,.5)*mx)|0;k[pc++]=(Math.pow(c,1/3)*mx)|0}}
  ascii+="\x80";while(ascii.length%64-56)ascii+="\x00";
  for(let i=0;i<ascii.length;i++){words[i>>2]|=ascii.charCodeAt(i)<<((3-i)%4)*8}
  words[words.length]=((bitLen/mx)|0);words[words.length]=bitLen;
  for(let j=0;j<words.length;){const w=words.slice(j,j+=16),old=hash;hash=hash.slice(0,8);
    for(let i=0;i<64;i++){const w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
      const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
    for(let i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0}
  const out=[];hash.slice(0,8).forEach(h=>{for(let s=24;s>=0;s-=8)out.push((h>>>s)&255)});return out;
}
async function pkce(v){
  if(window.crypto&&crypto.subtle){try{return b64url(Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)))))}catch(e){}}
  return b64url(sha256js(v));
}
function randStr(n){const cs="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~",a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,b=>cs[b%cs.length]).join("")}
const DBX={
  c(){try{return JSON.parse(LS.get("cf_dbx")||"{}")}catch(e){return{}}},
  s(c){LS.set("cf_dbx",JSON.stringify(c))},
  connected(){return!!this.c().refresh},
  async prepare(key,app){const v=randStr(64),ch=await pkce(v),c=this.c();c.key=key.trim();c.app=app.trim();c.verifier=v;
    c.url=`https://www.dropbox.com/oauth2/authorize?client_id=${encodeURIComponent(c.key)}&response_type=code&code_challenge=${ch}&code_challenge_method=S256&token_access_type=offline`;this.s(c)},
  async exchange(code){const c=this.c();let r;
    try{r=await fetch(TOKEN_URL,{method:"POST",body:new URLSearchParams({code:code.trim(),grant_type:"authorization_code",code_verifier:c.verifier,client_id:c.key})})}catch(e){throw new Error("Dropbox injoignable. Ouvre la page depuis un navigateur (pas un aperçu de fichier) et vérifie la connexion.")}
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error("Code refusé par Dropbox ("+(j.error_description||j.error||r.status)+"). Génère un nouveau lien et réessaie.");
    c.refresh=j.refresh_token;c.access=j.access_token;c.exp=Date.now()+((j.expires_in||14400)-120)*1000;delete c.verifier;delete c.url;this.s(c)},
  async tok(){const c=this.c();if(c.access&&c.exp>Date.now())return c.access;
    const r=await fetch(TOKEN_URL,{method:"POST",body:new URLSearchParams({grant_type:"refresh_token",refresh_token:c.refresh,client_id:c.key})});
    if(!r.ok)throw new Error("Connexion Dropbox expirée : reconnecte cet appareil dans les réglages.");

  async download(){const t=await this.tok();
    const r=await fetch("https://content.dropboxapi.com/2/files/download",{method:"POST",headers:{Authorization:"Bearer "+t,"Dropbox-API-Arg":JSON.stringify({path:DBX_PATH})}});
    if(r.status===409)return null;if(!r.ok)throw new Error("Lecture Dropbox impossible ("+r.status+")");return JSON.parse(await r.text())},

function merge(a,b){
  const o={version:1,settings:((b.settings||{}).updatedAt||0)>((a.settings||{}).updatedAt||0)?b.settings:a.settings,sessions:{},body:{}};
  for(const k of["sessions","body"]){const A=a[k]||{},B=b[k]||{};for(const d of new Set([...Object.keys(A),...Object.keys(B)])){const x=A[d],y=B[d];o[k][d]=!x?y:!y?x:((y.updatedAt||0)>(x.updatedAt||0)?y:x)}}
  return o;
}

async function sync(rerender){
  if(!DBX.connected()){setSync("","Sur cet appareil");return}
  if(syncing){again=true;return}syncing=true;again=false;setSync("busy","Synchro…");

});
layer.addEventListener("change",e=>{
  if(e.target.id==="st-date"&&e.target.value){S.settings.startDate=mondayOf(e.target.value);S.settings.updatedAt=Date.now();persist();e.target.value=S.settings.startDate}
  if(e.target.id==="imp"&&e.target.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.settings)throw 0;S=merge(S,d);persist();settingsSheet({ok:1,t:"Fichier importé et fusionné."})}catch(x){settingsSheet({t:"Ce fichier n'est pas un export du Carnet de Fonte."})}};r.readAsText(e.target.files[0])}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&layer.innerHTML){closeSheet();render()}});
window.addEventListener("online",()=>sync(true));
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sync(true)});

render();sync(true);
</script>
</body>
</html>
